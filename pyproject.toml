[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rymspin"
version = "0.1.0"
description = "Pick a random release from the ones a Rate Your Music user has rated."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HenestrosaDev", email = "github@henestrosa.dev" }]
requires-python = ">=3.9"
dependencies = ["playwright", "beautifulsoup4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rymspin = "rymspin:main"

[tool.setuptools]
py-modules = ["rymspin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
