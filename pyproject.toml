[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rymspin"
version = "0.1.0"
description = "Pick a random release from the ones a Rate Your Music user has rated."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HenestrosaDev", email = "github@henestrosa.dev" }]
requires-python = ">=3.10"
dependencies = ["playwright", "beautifulsoup4"]

[project.urls]
Homepage = "https://github.com/HenestrosaDev/rymspin"
Issues = "https://github.com/HenestrosaDev/rymspin/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[project.scripts]
rymspin = "rymspin.cli:main"

[tool.setuptools]
packages = ["rymspin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["rymspin", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
